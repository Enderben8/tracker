name: Release

# Tag a version to publish the downloads:  git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches app.version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep '^app.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app.version=$version in gradle.properties." >&2
            exit 1
          fi

      - run: ./gradlew :core:desktopTest :composeApp:desktopTest --stacktrace

      - run: ./gradlew :composeApp:packageMsi --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: composeApp/build/compose/binaries/main/msi/*.msi

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Signs with the real key when the secrets exist; otherwise the build falls
      # back to the debug key (see docs/NOTES.md).
      - name: Restore the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Name the APK after the version
        run: |
          version=$(grep '^app.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          apk=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          mkdir -p out && cp "$apk" "out/RevisionTracker-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk

  release:
    name: Publish the release
    needs: [windows, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads

      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/**/*
          generate_release_notes: true
          body: |
            **Windows:** download the `.msi`, double-click it, then open Revision Tracker from the Start Menu. Java is bundled; nothing else to install.

            **Android:** download the `.apk` on your phone and open it. See the README before installing over an older copy.
